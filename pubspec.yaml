name: universal_barcode_generator
description: A modern, fast, cross-platform mobile application to instantly generate QR Codes and 1D Barcodes from almost any type of content. Fully offline, privacy-first, production-ready.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Local storage & persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.2.2

  # QR & Barcode generation
  qr_flutter: ^4.1.0
  barcode: ^2.2.8
  barcode_widget: ^2.0.4
  pretty_qr_code: ^3.3.0
  qr: ^3.0.1

  # Scanner
  mobile_scanner: ^5.1.1
  image_picker: ^1.1.2

  # Export & files
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^9.0.0
  file_saver: ^0.2.13
  cross_file: ^0.3.4+1

  # CSV / Excel import
  csv: ^6.0.0
  excel: ^4.0.6

  # Utilities
  intl: ^0.20.2
  collection: ^1.18.0
  equatable: ^2.0.5
  uuid: ^4.4.0
  path: ^1.9.0
  logger: ^2.3.0
  url_launcher: ^6.3.0
  clipboard: ^0.1.3
  uuid_type: ^2.0.0

  # UI
  dynamic_color: ^1.7.0
  flex_color_scheme: ^7.3.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  smooth_page_indicator: ^1.1.0
  flutter_staggered_animations: ^1.1.1

  # Image manipulation
  image: ^4.2.0
  image_cropper: ^7.1.0

  # Permissions
  permission_handler: ^11.3.1

  # Misc
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0
  connectivity_plus: ^6.0.3
  vibration: ^1.9.0
  gal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  mockito: ^5.4.4
  mocktail: ^1.0.3
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
